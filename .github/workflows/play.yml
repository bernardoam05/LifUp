name: Play bundle

# Builds the signed App Bundle (.aab) to upload to Google Play, by hand from the Actions tab.
# Needs four repository secrets: UPLOAD_KEYSTORE_BASE64 (the upload keystore, base64), UPLOAD_KEYSTORE_PASSWORD,
# UPLOAD_KEY_ALIAS and UPLOAD_KEY_PASSWORD. The version comes from the newest folder in release-notes/.
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "UPLOAD_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Unit tests and bundle
        env:
          UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          v=$(ls release-notes | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          ./gradlew testPlayReleaseUnitTest bundlePlayRelease -PappVersion=$v
      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: app/build/outputs/bundle/playRelease/*.aab
