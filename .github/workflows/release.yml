name: Release

# Pushing a tag like v2.1.0 builds a signed APK and publishes it as a GitHub release; the app updates itself from there.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release APK
        run: ./gradlew testReleaseUnitTest assembleRelease -PappVersion=${GITHUB_REF_NAME#v}
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "lifup-${GITHUB_REF_NAME}.apk"
      - name: Release notes
        # The English notes in release-notes/<version>/ (the app reads the file in the phone's language);
        # without them, one line per commit since the previous tag.
        run: |
          notes="release-notes/${GITHUB_REF_NAME#v}/en.md"
          if [ -f "$notes" ]; then cp "$notes" notes.md; else
            prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            git log --no-merges --format='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME" > notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: lifup-*.apk
          body_path: notes.md
