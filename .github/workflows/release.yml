name: Release

# Pushing a tag like v2.1.0 builds a signed APK and publishes it as a GitHub release; the app updates itself from there.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release APK
        run: ./gradlew testReleaseUnitTest assembleRelease -PappVersion=${GITHUB_REF_NAME#v}
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "lifup-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: lifup-*.apk
          generate_release_notes: true
