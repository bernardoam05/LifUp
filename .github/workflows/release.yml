name: Release

# Builds a signed APK and publishes it as a GitHub release; the app updates itself from there. Two ways in:
# - a new release-notes/<version>/ folder reaching main releases that version (the tag v<version> is created here);
# - pushing a tag like v2.1.0 by hand.
on:
  push:
    branches: [main]
    paths: ['release-notes/**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: version
        # A tag push names its version. On main, the highest version in release-notes/ that has no tag yet;
        # none means the push only edited notes of a version already out, so nothing is released.
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else
            v=$(ls release-notes | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then v=""; fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          [ -n "$v" ] && echo "Releasing v$v" || echo "No new version to release"
      - uses: actions/setup-java@v4
        if: steps.version.outputs.version != ''
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.version != ''
      - name: Unit tests and release APK
        if: steps.version.outputs.version != ''
        run: ./gradlew testReleaseUnitTest assembleRelease -PappVersion=${{ steps.version.outputs.version }}
      - name: Rename APK
        if: steps.version.outputs.version != ''
        run: cp app/build/outputs/apk/release/app-release.apk "lifup-v${{ steps.version.outputs.version }}.apk"
      - name: Release notes
        if: steps.version.outputs.version != ''
        # The English notes in release-notes/<version>/ (the app reads the file in the phone's language);
        # without them, one line per commit since the previous tag.
        run: |
          v="${{ steps.version.outputs.version }}"
          notes="release-notes/$v/en.md"
          if [ -f "$notes" ]; then cp "$notes" notes.md; else
            prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            git log --no-merges --format='- %s' ${prev:+$prev..}HEAD > notes.md
          fi
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.version != ''
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: lifup-v*.apk
          body_path: notes.md
