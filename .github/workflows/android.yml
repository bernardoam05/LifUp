name: Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug 2>&1 | tee build.log
      - name: Compile errors as annotations
        if: failure()
        run: |
          grep -E '^e: |^> |error:' build.log | head -30 | sed 's/^/::error::/' || true
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: lifup-debug
          path: app/build/outputs/apk/debug/app-debug.apk
