<!doctype html>
<!--
  Pair-quest link (docs/PAIRS.md, 1.5). With the app installed, Android opens these links in
  the app (App Links, /.well-known/assetlinks.json) and this page is never shown. Everything
  after # stays in the browser: this page never reads, sends or stores it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Questborn</title>
<style>
  :root { --bg: #f6f4ef; --fg: #1d1b18; --muted: #6b665d; --accent: #b8860b; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121110; --fg: #f1ede4; --muted: #a39d91; --accent: #e0b23c; --card: #1d1b19; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 380px; width: 100%; background: var(--card); border-radius: 20px; padding: 32px 24px; text-align: center; }
  .mark { font-size: 44px; font-weight: 800; color: var(--accent); line-height: 1; }
  h1 { font-size: 22px; margin: 12px 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.btn { display: block; padding: 14px; border-radius: 12px; background: var(--accent); color: #1d1b18;
          font-weight: 700; text-decoration: none; margin-bottom: 10px; }
  a.alt { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">!</div>
  <h1 id="t">Your pair finished their part</h1>
  <p id="d">Open this link on the phone where Questborn is installed to count it.</p>
  <a class="btn" id="open" href="#">Open Questborn</a>
  <a class="alt" id="get" href="https://play.google.com/store/apps/details?id=com.lifup.app">Get Questborn</a>
</main>
<script>
  const text = {
    en: ['Your pair finished their part', 'Open this link on the phone where Questborn is installed to count it.', 'Open Questborn', 'Get Questborn'],
    pt: ['O teu par já fez a parte dele', 'Abre este link no telemóvel onde tens o Questborn para contar.', 'Abrir o Questborn', 'Instalar o Questborn'],
    es: ['Tu pareja ya hizo su parte', 'Abre este enlace en el móvil donde tienes Questborn para que cuente.', 'Abrir Questborn', 'Instalar Questborn'],
    fr: ['Ton binôme a fini sa part', 'Ouvre ce lien sur le téléphone où Questborn est installé pour qu’il compte.', 'Ouvrir Questborn', 'Installer Questborn'],
    de: ['Dein Partner hat seinen Teil erledigt', 'Öffne diesen Link auf dem Handy mit Questborn, damit er zählt.', 'Questborn öffnen', 'Questborn holen'],
  };
  const lang = (navigator.language || 'en').slice(0, 2);
  const [t, d, o, g] = text[lang] || text.en;
  document.documentElement.lang = text[lang] ? lang : 'en';
  document.getElementById('t').textContent = t;
  document.getElementById('d').textContent = d;
  document.getElementById('open').textContent = o;
  document.getElementById('get').textContent = g;
  // If App Links didn't kick in (some in-app browsers), hand the link to the app explicitly.
  // An intent: URL is resolved on the phone, never fetched, so the data can ride in ?d= here.
  const data = location.hash.slice(1);
  document.getElementById('open').href = 'intent://' + location.host + '/p/' +
    (data ? '?d=' + encodeURIComponent(data) : '') + '#Intent;scheme=https;package=com.lifup.app;end';
</script>
</body>
</html>
